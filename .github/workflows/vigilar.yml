name: Vigilar Fonazo (cada 5 min)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Enviar una alerta de caída de PRUEBA a tu WhatsApp'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigilar
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar la página
        run: node vigilar.mjs
        env:
          FONAZO_URL: https://fonazo-inventario.seenode.app
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          PRUEBA: ${{ inputs.prueba && 'si' || 'no' }}
      - name: Guardar el estado si cambió
        run: |
          if ! git diff --quiet estado.json; then
            git config user.name "vigilante-fonazo"
            git config user.email "vigilante@users.noreply.github.com"
            git add estado.json
            git commit -m "Estado: $(jq -r .estado estado.json)"
            git push
          fi
